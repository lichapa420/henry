version:
  contract: "1.0.0"

default_provider: openai

fallback:
  enabled: true
  providers:
    - anthropic
    - opencode

prompt:
  version: v1_zero_shot

metrics:
  path: data/metrics.jsonl

evals:
  min_score_by_category:
    billing: 0.90
    technical: 0.90
    account: 0.90
    other: 0.90

guardrails:
  input_enabled: true
  output_enabled: true
  max_input_chars: 4000
  max_output_chars: 4000
  injection_patterns: []
  output_block_patterns: []

providers:
  openai:
    enabled: true
    api_key_env: OPENAI_API_KEY
    model: gpt-4o-2024-08-06
    api_version: "2024-10-21"
    base_url: null
    temperature: 0.2
    top_p: 1.0
    max_tokens: 800
    timeout_seconds: 30
    streaming: false
    include_usage_in_stream: true
    headers: {}
    rate_limit:
      requests_per_minute: 60
      tokens_per_minute: 90000
    pricing:
      currency: USD
      input_per_1k_tokens: 0.0025
      output_per_1k_tokens: 0.01
    retry:
      max_attempts: 3
      initial_backoff_seconds: 0.5
      max_backoff_seconds: 8.0
      backoff_multiplier: 2.0
      jitter_seconds: 0.25
      retry_on_status: [408, 409, 429, 500, 502, 503, 504]
      retry_on_exceptions:
        - APIConnectionError
        - APITimeoutError
        - RateLimitError
        - APIStatusError
        - InstructorRetryException
        - IncompleteOutputException
        - ValidationError
        - JSONDecodeError

  anthropic:
    enabled: true
    api_key_env: ANTHROPIC_API_KEY
    model: claude-3-5-sonnet-20241022
    api_version: "2023-06-01"
    base_url: null
    temperature: 0.2
    top_p: 1.0
    max_tokens: 800
    timeout_seconds: 30
    streaming: false
    include_usage_in_stream: true
    headers: {}
    rate_limit:
      requests_per_minute: 50
      tokens_per_minute: 80000
    pricing:
      currency: USD
      input_per_1k_tokens: 0.003
      output_per_1k_tokens: 0.015
    retry:
      max_attempts: 3
      initial_backoff_seconds: 0.5
      max_backoff_seconds: 8.0
      backoff_multiplier: 2.0
      jitter_seconds: 0.25
      retry_on_status: [408, 409, 429, 500, 502, 503, 504]
      retry_on_exceptions:
        - APIConnectionError
        - APITimeoutError
        - RateLimitError
        - APIStatusError
        - InstructorRetryException
        - IncompleteOutputException
        - ValidationError
        - JSONDecodeError

  opencode:
    enabled: true
    api_key_env: null
    model: opencode/big-pickle
    api_version: "cli"
    base_url: null
    temperature: 0.2
    top_p: 1.0
    max_tokens: 800
    timeout_seconds: 120
    streaming: false
    include_usage_in_stream: false
    headers: {}
    rate_limit:
      requests_per_minute: 30
      tokens_per_minute: 60000
    pricing:
      currency: USD
      input_per_1k_tokens: 0.0
      output_per_1k_tokens: 0.0
    retry:
      max_attempts: 2
      initial_backoff_seconds: 0.5
      max_backoff_seconds: 4.0
      backoff_multiplier: 2.0
      jitter_seconds: 0.25
      retry_on_status: []
      retry_on_exceptions:
        - ProviderError
        - ValidationError
